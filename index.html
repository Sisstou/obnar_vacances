
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBNAR VACANCES</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f8fb;color:#17324d}
header{background:#063b60;color:white;padding:25px 15px;text-align:center}
header h1{margin:0;font-size:28px}
header p{margin:10px 0 0}
nav{background:#fff;padding:15px;text-align:center}
nav a{color:#063b60;text-decoration:none;margin:10px;font-weight:bold}
.hero{padding:55px 20px;text-align:center;background:#dcecf5}
.hero h2{font-size:27px}
.btn{background:#087eae;color:white;padding:13px 25px;border:0;border-radius:8px;font-size:16px}
section{padding:25px 18px}
.search{background:white;padding:20px;border-radius:12px;max-width:500px;margin:auto;box-shadow:0 2px 10px #ddd}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:7px}
footer{background:#063b60;color:white;text-align:center;padding:20px}
</style>
</head>
<body>
<header>
<h1>OBNAR VACANCES</h1>
<p>منصتك لحجز العطلات والإقامات في أولاد بونار وجيجل</p>
</header>
<nav>
<a href="#">الرئيسية</a>
<a href="#search">البحث عن سكن</a>
<a href="#contact">اتصل بنا</a>
</nav>
<div class="hero">
<h2>اكتشف عطلتك في جيجل 🌊</h2>
<p>ابحث عن إقامة مناسبة واستمتع بعطلتك.</p>
<button class="btn" onclick="document.getElementById('search').scrollIntoView()">ابحث الآن</button>
</div>
<section id="search">
<div class="search">
<h2>ابحث عن إقامة</h2>
<input type="text" placeholder="المدينة أو المنطقة">
<input type="date" id="arrival">
<input type="date" id="departure">
<select id="guests">
<option value="1">شخص واحد</option>
<option value="2">شخصان</option>
<option value="3">3 أشخاص</option>
<option value="4">4 أشخاص</option>
<option value="5">5 أشخاص أو أكثر</option>
</select>
<button class="btn" onclick="alert('قريباً: ستتوفر الإقامات للحجز هنا')">بحث</button>
</div>
</section>
<section id="contact">
<h2 style="text-align:center">OBNAR VACANCES</h2>
<p style="text-align:center">إقامتك القادمة تبدأ من هنا.</p>
</section>
<footer>© 2026 OBNAR VACANCES</footer>
</body>
</html>

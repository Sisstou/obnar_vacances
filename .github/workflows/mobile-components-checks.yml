name: Mobile component checks

on:
  push:
    branches:
      - mobile-app
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-components-checks.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-components-checks.yml"

permissions:
  contents: read

jobs:
  mobile-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: TypeScript typecheck
        run: npm run typecheck

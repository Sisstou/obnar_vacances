# Simple workflow for deploying static content to Pages
name: Deploy static content to Pages

on:
  # Run regression tests on proposed changes before they can be merged.
  pull_request:
    branches: ["main"]

  # Deploy only after the regression suite passes on main.
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Keep the default token permissions minimal for all jobs.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between runs.
# Do NOT cancel an in-progress production deployment.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  regression-tests:
    name: Platform regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run platform regression tests
        run: node --test tests/platform-regression.test.cjs

  # Publishing is restricted to the default branch, including manual runs.
  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: regression-tests
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the site under the artifact name expected by deploy-pages
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

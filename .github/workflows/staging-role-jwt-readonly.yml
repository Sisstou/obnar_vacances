name: Staging authenticated role security (read-only)

on:
  workflow_dispatch:
    inputs:
      confirm_staging_only:
        description: "Confirm this workflow targets the isolated OBNAR VACANCES Staging project only"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  authenticated-role-security:
    if: inputs.confirm_staging_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate test script syntax
        run: node --check tests/role-security-jwt-readonly.test.cjs

      - name: Verify authenticated role isolation against Staging (read-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TRAVELER_EMAIL: ${{ secrets.TRAVELER_EMAIL }}
          TRAVELER_PASSWORD: ${{ secrets.TRAVELER_PASSWORD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node tests/role-security-jwt-readonly.test.cjs

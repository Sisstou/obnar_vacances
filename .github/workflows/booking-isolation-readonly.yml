name: Read-only booking isolation security tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  booking-isolation-read-only:
    name: Verify non-participant booking reads are blocked
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run read-only Staging isolation checks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRAVELER_EMAIL: ${{ secrets.TRAVELER_EMAIL }}
          TRAVELER_PASSWORD: ${{ secrets.TRAVELER_PASSWORD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          SECURITY_TEST_BOOKING_ID: ${{ vars.SECURITY_TEST_BOOKING_ID }}
        run: node tests/booking-isolation-readonly.test.cjs

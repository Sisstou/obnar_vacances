name: Booking lifecycle JWT end-to-end tests

on:
  workflow_dispatch:
  push:
    branches:
      - test/booking-lifecycle-jwt-e2e
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  booking-lifecycle-e2e:
    name: Run booking lifecycle flows against isolated Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate test script syntax
        run: node --check tests/booking-lifecycle-jwt-e2e.test.cjs

      - name: Validate property verification test script syntax
        run: node --check tests/property-verification-jwt-e2e.test.cjs

      - name: Run Staging-only booking lifecycle JWT end-to-end tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRAVELER_EMAIL: ${{ secrets.TRAVELER_EMAIL }}
          TRAVELER_PASSWORD: ${{ secrets.TRAVELER_PASSWORD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node tests/booking-lifecycle-jwt-e2e.test.cjs

      - name: Run Staging-only property verification JWT end-to-end tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRAVELER_EMAIL: ${{ secrets.TRAVELER_EMAIL }}
          TRAVELER_PASSWORD: ${{ secrets.TRAVELER_PASSWORD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node tests/property-verification-jwt-e2e.test.cjs

      - name: Validate property management test script syntax
        run: node --check tests/property-management-jwt-e2e.test.cjs

      - name: Run Staging-only property management JWT end-to-end tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node tests/property-management-jwt-e2e.test.cjs

      - name: Validate storage access test script syntax
        run: node --check tests/storage-access-jwt-e2e.test.cjs

      - name: Run Staging-only storage access JWT end-to-end tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          TRAVELER_EMAIL: ${{ secrets.TRAVELER_EMAIL }}
          TRAVELER_PASSWORD: ${{ secrets.TRAVELER_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node tests/storage-access-jwt-e2e.test.cjs

name: Cancellation and refund JWT end-to-end tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancellation-refund-e2e:
    name: Run cancellation/refund flows against isolated Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate test script syntax
        run: node --check tests/cancellation-refund-e2e.test.cjs

      - name: Run Staging-only JWT end-to-end tests
        env:
          SUPABASE_URL: \${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: \${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: \${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRAVELER_EMAIL: \${{ secrets.TRAVELER_EMAIL }}
          TRAVELER_PASSWORD: \${{ secrets.TRAVELER_PASSWORD }}
          OWNER_EMAIL: \${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: \${{ secrets.OWNER_PASSWORD }}
          ADMIN_EMAIL: \${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: \${{ secrets.ADMIN_PASSWORD }}
        run: node tests/cancellation-refund-e2e.test.cjs
